```yaml
name: Update Private + Public Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_stats.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate statistics
        run: python scripts/update_stats.py
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/total-commits.svg
          git diff --cached --quiet || (
            git commit -m "Update total commit statistics"
            git push
          )
```